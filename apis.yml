description: 'SEI Novus (Novus) is the portfolio intelligence and analytics platform
  of SEI Investments, serving institutional investors — asset owners, pension funds,
  endowments, foundations, and family offices — with manager monitoring, exposure
  and performance analytics, risk assessment, and reporting across public and private
  market portfolios. It is an enterprise, client-login product accessed at alpha.novus.com;
  it exposes no public developer API, documentation, or SDK surface. Originally an
  independent portfolio-analytics company (novus.com), it was acquired by SEI Investments.'
